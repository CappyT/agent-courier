# Development container for agent-courier. See hack/README.md.
# Create it from the repo root: the init hooks run hack/install-tools.sh, which pins the tool versions
# and sha256 checksums. The tool downloads are for amd64. Init hooks run as root and skip an installed tool.
[agent-courier-dev]
image=docker.io/library/ubuntu:24.04
additional_packages="make git curl jq ca-certificates tar gzip unzip gcc libc6-dev"
init_hooks="echo ZXhwb3J0IFBBVEg9L3Vzci9sb2NhbC9nby9iaW46L3Vzci9sb2NhbC9iaW46JEhPTUUvZ28vYmluOiRQQVRICmV4cG9ydCBHT01PRENBQ0hFPSRIT01FLy5jYWNoZS9hZ2VudC1jb3VyaWVyL2dvbW9kCg== | base64 -d > /etc/profile.d/go.sh"
init_hooks="sh ${PWD}/hack/install-tools.sh"
