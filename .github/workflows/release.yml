name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tags: ${{ steps.check.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release tag is annotated: a lightweight tag points at a commit.
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
          if [ "$type" != "tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not annotated (object type $type)"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          go_version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)
          plugin_version=$(jq -r .version .claude-plugin/plugin.json)
          opencode_version=$(jq -r .version opencode/package.json)
          for v in "$go_version" "$plugin_version" "$opencode_version"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the versions: internal/version $go_version, plugin.json $plugin_version, package.json $opencode_version"
              exit 1
            fi
          done
          image=ghcr.io/cappyt/agent-courier
          tags="$image:$tag"
          # latest moves only to the highest release tag, never to a pre-release.
          highest=$(git tag --list 'v*' | { grep -v -- - || true; } | sort -V | tail -n1)
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            tags="$tags,$image:latest"
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  image:
    needs: [ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
